name: Publish browser UI asset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/**
      - patches/**
      - package.json
      - package-lock.json
      - scripts/prepare
      - scripts/prepare_asar
      - .github/workflows/publish-ui-asset.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: CODEX_WEB_PREPARE_FROM_DESKTOP=1 npm ci
      - run: tar -czf codex-web-ui.tar.gz scratch/asar
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ui-latest >/dev/null 2>&1; then
            gh release upload ui-latest codex-web-ui.tar.gz --clobber
          else
            gh release create ui-latest codex-web-ui.tar.gz \
              --title "codex-web browser UI" \
              --notes "Prebuilt Codex Desktop browser UI for codex-web installers."
          fi
